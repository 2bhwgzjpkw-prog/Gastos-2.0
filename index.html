<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuentas personales</title>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont;
}

header{
  padding:16px;
  border-bottom:1px solid #222;
  font-size:20px;
  font-weight:600;
}

.container{
  padding:16px;
}

.account{
  background:#1c1c1e;
  border-radius:12px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  cursor:pointer;
}

.account .total.positive{color:#30d158}
.account .total.negative{color:#ff453a}

.form{
  display:grid;
  gap:10px;
  margin:20px 0;
}

input,select{
  background:#1c1c1e;
  border:none;
  border-radius:10px;
  padding:12px;
  color:white;
  font-size:16px;
}

button{
  background:#0a84ff;
  border:none;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  color:white;
}

.item{
  background:#1c1c1e;
  border-radius:12px;
  padding:12px;
  display:grid;
  grid-template-columns:90px 1fr auto auto;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}

.date{font-size:13px;color:#aaa}
.amount.ingreso{color:#30d158}
.amount.egreso{color:#ff453a}
.trash{cursor:pointer}
.back{margin-bottom:10px;color:#0a84ff;cursor:pointer}
.add-account{margin-top:10px}
</style>
</head>

<body>

<header id="title">Cuentas</header>

<div class="container" id="app"></div>

<script>
let data = JSON.parse(localStorage.getItem("cuentas")) || {};
let currentAccount = null;
let editIndex = null;

function save(){
  localStorage.setItem("cuentas", JSON.stringify(data));
}

function money(n){
  return n.toLocaleString("es-MX");
}

function formatDate(fechaISO){
  const d = new Date(fechaISO);
  return d.toLocaleDateString("es-MX", {
    day:"2-digit", month:"2-digit", year:"numeric"
  });
}

function accountTotal(name){
  return data[name].reduce((t,x)=>t+(x.type==="ingreso"?x.amount:-x.amount),0);
}

/* ---------- LISTA DE CUENTAS ---------- */
function renderAccounts(){
  const app=document.getElementById("app");
  document.getElementById("title").textContent="Cuentas";
  app.innerHTML="";

  Object.keys(data).forEach(name=>{
    const t = accountTotal(name);
    app.innerHTML+=`
      <div class="account" onclick="openAccount('${name}')">
        <span>${name}</span>
        <span class="total ${t>=0?'positive':'negative'}">$${money(t)}</span>
      </div>`;
  });

  app.innerHTML+=`
    <div class="form add-account">
      <input type="text" id="newAccount" placeholder="Nueva cuenta">
      <button onclick="addAccount()">Agregar cuenta</button>
    </div>`;
}

function addAccount(){
  const name=document.getElementById("newAccount").value.trim();
  if(!name || data[name]) return;
  data[name]=[];
  save();
  renderAccounts();
}

/* ---------- CUENTA ABIERTA ---------- */
function openAccount(name){
  currentAccount=name;
  editIndex=null;
  document.getElementById("title").textContent=name;
  const app=document.getElementById("app");

  data[name].sort((a,b)=> new Date(b.date)-new Date(a.date));

  app.innerHTML=`
    <div class="back" onclick="renderAccounts()">← Volver</div>

    <div class="form">
      <input type="date" id="date">
      <input type="number" id="amount" placeholder="Monto">
      <input type="text" id="desc" placeholder="Concepto">
      <select id="type">
        <option value="ingreso">Ingreso</option>
        <option value="egreso">Egreso</option>
      </select>
      <button onclick="saveMovement()">Guardar</button>
    </div>
  `;

  data[name].forEach((x,i)=>{
    app.innerHTML+=`
      <div class="item" onclick="edit(${i})">
        <div class="date">${formatDate(x.date)}</div>
        <div>${x.desc}</div>
        <div class="amount ${x.type}">
          ${x.type==="ingreso"?"+":"-"}$${money(x.amount)}
        </div>
        <div class="trash" onclick="remove(${i});event.stopPropagation()">🗑</div>
      </div>`;
  });

  app.innerHTML+=`
    <button style="background:#ff453a;margin-top:10px"
      onclick="deleteAccount('${name}')">
      Eliminar cuenta
    </button>`;
}

function saveMovement(){
  const date=document.getElementById("date").value;
  const amount=+document.getElementById("amount").value;
  const desc=document.getElementById("desc").value;
  const type=document.getElementById("type").value;
  if(!date||!amount) return;

  const m={date,amount,desc,type};

  if(editIndex!==null){
    data[currentAccount][editIndex]=m;
    editIndex=null;
  }else{
    data[currentAccount].push(m);
  }
  save();
  openAccount(currentAccount);
}

function edit(i){
  const m=data[currentAccount][i];
  document.getElementById("date").value=m.date;
  document.getElementById("amount").value=m.amount;
  document.getElementById("desc").value=m.desc;
  document.getElementById("type").value=m.type;
  editIndex=i;
}

function remove(i){
  data[currentAccount].splice(i,1);
  save();
  openAccount(currentAccount);
}

function deleteAccount(name){
  if(!confirm("¿Eliminar la cuenta y todos sus movimientos?")) return;
  delete data[name];
  save();
  renderAccounts();
}

renderAccounts();
</script>

</body>
</html>
